<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="InstaGo">
  <defs>
    <linearGradient id="instago-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="48%" stop-color="#C026D3" />
      <stop offset="82%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="instago-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="emblem-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- App badge squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#instago-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#instago-sheen)" />
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />

  <!-- Studio frame + Go chevron + flash dot -->
  <g filter="url(#emblem-shadow)">
    <rect
      x="114"
      y="114"
      width="284"
      height="284"
      rx="78"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="34"
    />
    <!-- Top-right camera/studio flash dot -->
    <circle cx="328" cy="184" r="19" fill="#FFFFFF" />
    <!-- Centered Go / Play emblem -->
    <path
      d="M204 198 C204 188.5 214.5 182.8 222.6 187.8 L312.6 244.8 C320.2 249.6 320.2 260.4 312.6 265.2 L222.6 322.2 C214.5 327.2 204 321.5 204 312 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
